[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdelta"
version = "0.1.0"
description = "Small prompt regression tests with offline replay, deterministic assertions and HTML diffs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "wenjialei15"}]
keywords = ["llm", "prompt", "regression-testing", "evaluation"]
dependencies = []

[project.scripts]
promptdelta = "promptdelta.cli:main"

[project.urls]
Repository = "https://github.com/wenjialei15/promptdelta"
Issues = "https://github.com/wenjialei15/promptdelta/issues"

[tool.setuptools.packages.find]
include = ["promptdelta*"]
